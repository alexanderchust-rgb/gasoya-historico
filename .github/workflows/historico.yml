name: Foto diaria de precios

on:
  schedule:
    - cron: "30 6 * * *" # todos los días a las 06:30 UTC (07:30 o 08:30 en España)
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar precios y guardar la foto
        run: node snapshot.mjs
      - name: Guardar el archivo en el repositorio
        run: |
          git config user.name "gasoya-bot"
          git config user.email "gasoya-bot@users.noreply.github.com"
          git add data/historico.json
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Precios del día"
          git push
